spring.application.name=foodwasteai-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodwasteai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${APP_JWT_SECRET:local-development-only-change-this-secret-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.ai-service.url=${APP_AI_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}